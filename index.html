<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19324d"><title>Korean Study · 한국어 Assessment</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="hero"><div class="kicker">KOREAN STUDY · ASSESSMENT</div><h1>한국어 능력 진단 <span>🎙️</span></h1><p>생활 한국어부터 읽기·듣기·말하기·쓰기까지, 나이에 맞게 확인해요.</p></header><section id="gate" class="panel"><div class="tabs"><button id="tabNew" class="active">처음이에요</button><button id="tabBack">다시 왔어요</button></div><form id="newForm"><label>거주국가 <small>Nation / Country of residence</small></label><div id="countries" class="countries"></div><div id="localized" hidden><label id="birthLabel"></label><select id="birthYear" required></select><p class="help">‘나이’ 대신 태어난 연도를 선택합니다. 국가별 나이 계산 방식의 차이를 피하기 위해서예요.</p><div class="grid2"><div><label id="familyLabel"></label><input id="familyName" required autocomplete="family-name"></div><div><label id="givenLabel"></label><input id="givenName" required autocomplete="given-name"></div></div><button class="primary">등록하고 시작하기</button></div></form><form id="backForm" hidden><p class="help strong">처음 등록한 뒤에는 성과 이름만 입력해요.</p><div class="grid2"><div><label>성 <small>Family name</small></label><input id="backFamily" required></div><div><label>이름 <small>Given name</small></label><input id="backGiven" required></div></div><button class="primary">이어하기</button></form><p id="gateMsg" class="msg"></p></section><section id="assessment" hidden><section class="panel welcome"><div><span class="tag">TODAY'S CHECK</span><h2><span id="learnerName"></span>님, 반가워요!</h2><p id="levelNote"></p></div><button id="logout" class="soft">나가기</button></section><div class="steps"><span id="bar"></span></div><section class="panel task"><div class="taskhead"><span id="domain" class="tag"></span><span id="counter"></span></div><h2 id="taskTitle"></h2><p id="taskText" class="prompt"></p><div id="choiceBox" class="choices"></div><textarea id="writeBox" rows="6" hidden placeholder="여기에 한국어로 써 보세요."></textarea><div id="speechBox" hidden><div class="speech-actions"><button id="speakBtn" class="record">● 말하기 시작</button><button id="stopBtn" class="soft" disabled>■ 멈추기</button></div><div id="speechStatus" class="help"></div><div id="transcript" class="transcript" hidden></div></div><div id="feedback" class="feedback" hidden></div><div class="nav"><button id="nextBtn" class="primary">다음</button></div></section></section><section id="done" class="panel" hidden><span class="tag">ASSESSMENT COMPLETE</span><h2>진단이 끝났어요 🎉</h2><p>결과는 점수 하나가 아니라 네 영역의 프로필로 보여드려요.</p><div id="scoreCards" class="scorecards"></div><div id="summary" class="summary"></div><button id="printBtn" class="primary">결과 인쇄 / PDF 저장</button><button id="restartBtn" class="soft">처음으로</button></section><footer>AI 음성인식은 보조 평가입니다. 최종 판단은 교사의 관찰과 함께 사용하세요.</footer></main><script src="app.js"></script></body></html>
